<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Strings: Dating Simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <div id="loading-screen">
            <div class="heart-loader">
                <svg viewBox="0 0 32 32" width="32" height="32">
                    <path d="M16,28.261c0,0-14-7.926-14-17.046c0-9.356,13.159-10.399,14-0.454c1.011-9.938,14-8.903,14,0.454C30,20.335,16,28.261,16,28.261z" />
                </svg>
            </div>
            <p>Loading Heart Strings...</p>
        </div>

        <div id="main-menu" class="screen hidden">
            <h1>Heart Strings</h1>
            <div class="menu-buttons">
                <button id="start-game">Start Game</button>
                <button id="settings-button">Settings</button>
            </div>
        </div>

        <div id="character-select" class="screen hidden">
            <h2>Choose Your Date</h2>
            <div id="characters-container"></div>
            <button id="back-to-menu" class="back-button">Back</button>
        </div>

        <div id="location-select" class="screen hidden">
            <h2>Choose a Location</h2>
            <div id="locations-container"></div>
            <div class="character-preview">
                <div id="selected-character-image"></div>
                <p id="selected-character-name"></p>
                <p id="relationship-status"></p>
            </div>
            <button id="back-to-characters" class="back-button">Back</button>
        </div>

        <div id="date-screen" class="screen hidden">
            <div id="location-image"></div>
            <div id="character-portrait"></div>
            <div id="dialogue-box">
                <p id="character-name"></p>
                <p id="dialogue-text"></p>
                <div id="response-options"></div>
                <div id="timer-container">
                    <span id="timer-label">Time remaining: </span>
                    <span id="timer">15:00</span>
                </div>
            </div>
            <button id="move-location" class="action-button hidden">Change Location</button>
            <button id="end-date" class="action-button">End Date</button>
            <div id="typing-container" class="hidden">
                <input type="text" id="user-input" placeholder="Type your response...">
                <button id="send-response">Send</button>
            </div>
        </div>

        <div id="summary-screen" class="screen hidden">
            <h2>Date Summary</h2>
            <div id="character-summary-image"></div>
            <p id="character-summary-name"></p>
            <p id="relationship-change"></p>
            <p id="date-feedback"></p>
            <button id="return-to-character-select">Continue</button>
        </div>

        <div id="settings-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Settings</h2>
                <div class="setting">
                    <label for="tts-toggle">Text-to-Speech:</label>
                    <input type="checkbox" id="tts-toggle" checked>
                </div>
                <div class="setting">
                    <label for="voice-speed">Voice Speed:</label>
                    <input type="range" id="voice-speed" min="0.5" max="2" step="0.1" value="1">
                    <span id="voice-speed-value">1.0</span>
                </div>
                <div class="setting">
                    <label for="voice-volume">Voice Volume:</label>
                    <input type="range" id="voice-volume" min="0" max="1" step="0.1" value="1">
                    <span id="voice-volume-value">1.0</span>
                </div>
                <div class="setting">
                    <label for="text-speed">Text Display Speed:</label>
                    <input type="range" id="text-speed" min="10" max="100" step="5" value="50">
                    <span id="text-speed-value">50</span>
                </div>
                <div class="setting">
                    <button id="reset-progress">Reset All Progress</button>
                </div>
                <button id="close-settings">Close</button>
            </div>
        </div>

        <div id="confirmation-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Confirm</h2>
                <p id="confirmation-message"></p>
                <div class="modal-buttons">
                    <button id="confirm-yes">Yes</button>
                    <button id="confirm-no">No</button>
                </div>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "marked": "https://cdn.jsdelivr.net/npm/marked@5.0.2/lib/marked.esm.js"
        }
    }
    </script>
    <script src="config.js"></script>
    <script src="data.js"></script>
    <script src="utils.js"></script>
    <script src="ui.js"></script>
    <script src="memory.js"></script>
    <script src="imageGen.js"></script>
    <script src="tts.js"></script>
    <script src="gameLogic.js"></script>
    <script src="app.js"></script>

</body>
</html>
